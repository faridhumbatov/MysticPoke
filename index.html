<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MysticPoké | Ultimate Encyclopedia</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="bg-pattern"></div>
    <div id="overlay" class="overlay"></div>
    <header class="main-header glass">
        <div class="header-left">
            <button id="menuBtn" class="menu-toggle" aria-label="Toggle Menu">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            <div class="logo-container">
                <h1>Mystic<span class="highlight">Poké</span></h1>
            </div>
        </div>

        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="Search..." autocomplete="off">
            <button id="searchBtn">🔍</button>
        </div>
    </header>

    <div class="app-container">
        <aside class="sidebar glass" id="sidebar">
            <div class="sidebar-header">
                <h3>Elemental Types</h3>
                <span id="closeSidebar" class="close-sidebar">&times;</span>
            </div>
            <div class="filter-buttons" id="typeFilters">
                <button class="filter-btn active" data-type="all">All</button>
            </div>
        </aside>

        <main class="main-content">
            <div id="pokeGrid" class="pokemon-grid"></div>

            <div id="loader" class="loader-container">
                <div class="pokeball-spinner"></div>
                <p>Loading...</p>
            </div>

            <div id="notFound" class="not-found hidden">
                <p>No results found 😔</p>
            </div>
        </main>
    </div>

    <div id="pokemonModal" class="modal">
        <div class="modal-content glass-modal">
            <div class="modal-header">
                <h2 id="modalName">NAME</h2>
                <div class="header-right">
                    <button id="shinyBtn" class="action-btn" title="Toggle Shiny Mode">✨ Shiny</button>
                    <button id="soundBtn" class="action-btn" title="Play Cry">🔊 Cry</button>
                    <span class="close-btn">&times;</span>
                </div>
            </div>
            <div class="modal-body">
                <div class="modal-image-wrapper">
                    <div class="bg-circle"></div>
                    <img id="modalImg" src="" alt="Pokemon">
                </div>
                <div class="modal-badges" id="modalTypes"></div>
                <div class="stats-grid">
                    <div class="stat-item"><span class="label">ID</span><span class="value" id="modalId">#001</span>
                    </div>
                    <div class="stat-item"><span class="label">Height</span><span class="value"
                            id="modalHeight">0.7m</span></div>
                    <div class="stat-item"><span class="label">Weight</span><span class="value"
                            id="modalWeight">6.9kg</span></div>
                </div>
                <div class="base-stats-container" id="modalStats"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
